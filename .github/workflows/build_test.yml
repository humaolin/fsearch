
name: Build FSearch ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-arm64:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FSearch in Debian10 ARM64
        run: |

          docker run --rm \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/src \
            arm64v8/debian:buster \
            bash -exc '

            apt-get update

            DEBIAN_FRONTEND=noninteractive apt-get install -y \
                git \
                build-essential \
                gcc \
                g++ \
                meson \
                ninja-build \
                pkg-config \
                gettext \
                intltool \
                libgtk-3-dev \
                libicu-dev \
                libxml2-dev

            cd /src

            meson setup build \
              --buildtype=release

            ninja -C build

            mkdir -p release

            cp build/src/fsearch release/

            '

      - name: Check Architecture
        run: |

          file release/fsearch

      - name: Check GLIBC
        run: |

          strings release/fsearch | grep GLIBC_ | sort -u

      - name: Create Package
        run: |

          mkdir package

          cp release/fsearch package/

          cat > package/README.txt <<EOF
          FSearch ARM64
          Built by GitHub Actions
          EOF

          tar czf \
            fsearch-arm64.tar.gz \
            -C package .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsearch-arm64
          path: |
            fsearch-arm64.tar.gz
            release/fsearch

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fsearch-arm64.tar.gz


