name: Build FSearch ARM64 GLIBC228

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in Debian10 ARM64
        run: |

          docker run --rm \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            arm64v8/debian:buster \
            bash -exc '

            cat >/etc/apt/sources.list <<EOF
deb http://archive.debian.org/debian buster main contrib non-free
deb http://archive.debian.org/debian-security buster/updates main contrib non-free
EOF

            echo "Acquire::Check-Valid-Until false;" \
              >/etc/apt/apt.conf.d/99no-check-valid

            apt-get update \
              -o Acquire::Check-Valid-Until=false

            DEBIAN_FRONTEND=noninteractive \
            apt-get install -y \
                build-essential \
                git \
                meson \
                ninja-build \
                pkg-config \
                gettext \
                intltool \
                libgtk-3-dev \
                libglib2.0-dev \
                libicu-dev \
                libxml2-dev

            cd /tmp

            git clone \
              --branch 0.2.3 \
              --depth 1 \
              https://github.com/cboxdoerfer/fsearch.git

            cd fsearch

            meson setup build \
                --buildtype=release

            ninja -C build

            mkdir -p /workspace/release

            cp build/src/fsearch \
               /workspace/release/

            '

      - name: Verify
        run: |

          file release/fsearch

          strings release/fsearch \
            | grep GLIBC_ \
            | sort -u

      - name: Package
        run: |

          tar czf \
            fsearch-arm64-glibc228.tar.gz \
            -C release .

      - uses: actions/upload-artifact@v4
        with:
          name: fsearch-arm64-glibc228
          path: |
            release/fsearch
            fsearch-arm64-glibc228.tar.gz

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            fsearch-arm64-glibc228.tar.gz
