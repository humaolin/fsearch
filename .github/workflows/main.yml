name: Build FSearch ARM64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FSearch
        shell: bash
        run: |
          mkdir -p release

          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD:/workspace" \
            arm64v8/debian:bullseye \
            /bin/bash -c "
            set -ex

            apt-get update

            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git \
              build-essential \
              meson \
              ninja-build \
              pkg-config \
              gettext \
              intltool \
              libgtk-3-dev \
              libglib2.0-dev \
              libicu-dev \
              libxml2-dev \
              libcairo2-dev \
              libpango1.0-dev

            cd /tmp

            git clone --depth 1 https://github.com/cboxdoerfer/fsearch.git

            cd fsearch

            meson setup build --buildtype=release

            ninja -C build

            BIN=\$(find build -type f -name fsearch | head -1)

            cp \$BIN /workspace/release/fsearch
            "

      - name: Verify
        run: |
          file release/fsearch || true
          strings release/fsearch | grep GLIBC_ | sort -u || true

      - name: Package
        run: |
          tar czf fsearch-arm64.tar.gz -C release .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsearch-arm64
          path: |
            release/fsearch
            fsearch-arm64.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fsearch-arm64.tar.gz
