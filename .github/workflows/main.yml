name: Build FSearch ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: arm64v8/debian:buster

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          apt-get update

          apt-get install -y \
            git \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libicu-dev

      - name: Build
        run: |
          meson setup build
          ninja -C build

      - name: Package
        run: |
          mkdir release
          cp build/src/fsearch release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsearch-arm64
          path: release/*


      - name: Create tar.gz
        run: |
          tar czvf fsearch-arm64-glibc228.tar.gz \
          -C release .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.3-arm64
          files: |
            fsearch-arm64-glibc228.tar.gz
